name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  evaluate:
    # OpenCode imports a fetched derivation during evaluation.
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            hosts: m2air m2air-stock vm
          - runner: ubuntu-latest
            hosts: vm-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate all hosts
        # The private inventory input is replaced by the same-shaped public stub.
        run: |
          for host in ${{ matrix.hosts }}; do
            targets=(toplevel)
            case "$host" in vm|vm-x86_64) targets+=(vm) ;; esac
            for target in "${targets[@]}"; do
              echo "::group::$host ($target)"
              nix eval --raw --no-write-lock-file \
                --override-input inventory path:./ci/inventory-stub \
                ".#nixosConfigurations.$host.config.system.build.$target.drvPath"
              echo
              echo "::endgroup::"
            done
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Formatting
        run: |
          nix fmt
          git diff --exit-code
      - name: statix and deadnix
        run: nix run .#lint
