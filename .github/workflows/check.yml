name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run_evaluate: ${{ steps.filter.outputs.run_evaluate }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Determine CI scope
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_evaluate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "$base_sha...$head_sha")"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "run_evaluate=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_evaluate=false" >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: plan
    if: needs.plan.outputs.run_evaluate == 'true'
    # OpenCode imports a fetched derivation during evaluation.
    strategy:
      matrix:
        include:
          - arch: arm64
            hosts: m2air m2air-stock vm
          - arch: x86_64
            hosts: vm-x86_64
    runs-on: >-
      ${{
        matrix.arch == 'arm64' && (
          vars.USE_SPARK_ARM_RUNNER == 'true'
          && github.repository == 'Th0rgal/nixos-config'
          && (
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
            || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
          )
          && fromJSON('["self-hosted","linux","arm64","spark"]')
          || 'ubuntu-24.04-arm'
        )
        || (
          vars.USE_LEAN_CI_RUNNERS == 'true'
          && github.repository == 'Th0rgal/nixos-config'
          && (
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
            || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
          )
          && 'lean-16vcpu-ubuntu-2604'
          || 'ubuntu-latest'
        )
      }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        if: matrix.arch != 'arm64' || vars.USE_SPARK_ARM_RUNNER != 'true'
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-substituters = ${{ vars.NIX_EXTRA_SUBSTITUTER }}
            extra-trusted-public-keys = ${{ vars.NIX_EXTRA_PUBLIC_KEY }}
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        if: runner.environment != 'self-hosted'
      - name: Evaluate all hosts
        # The private inventory input is replaced by the same-shaped public stub.
        run: |
          for host in ${{ matrix.hosts }}; do
            targets=(toplevel)
            case "$host" in vm|vm-x86_64) targets+=(vm) ;; esac
            for target in "${targets[@]}"; do
              echo "::group::$host ($target)"
              nix eval --raw --no-write-lock-file \
                --override-input inventory path:./ci/inventory-stub \
                ".#nixosConfigurations.$host.config.system.build.$target.drvPath"
              echo
              echo "::endgroup::"
            done
          done

  lint:
    runs-on: >-
      ${{
        vars.USE_LEAN_CI_RUNNERS == 'true'
        && github.repository == 'Th0rgal/nixos-config'
        && (
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
          || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        )
        && 'lean-16vcpu-ubuntu-2604'
        || 'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        if: runner.environment != 'self-hosted'
      - name: Formatting
        run: |
          nix fmt
          git diff --exit-code
      - name: statix and deadnix
        run: nix run .#lint
